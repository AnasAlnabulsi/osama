<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName nextcloud.barye.cloudns.asia
    ProxyPreserveHost On

    # Ausnahmen für spezielle Nextcloud-Pfade
    ProxyPass /.well-known !
    ProxyPass /ocm-provider !

    # Proxy-Einstellungen für den Nextcloud-Server
    ProxyPass / http://nextcloud:80/
    ProxyPassReverse / http://nextcloud:80/

 # Spezifische Weiterleitungen für .well-known
 RewriteEngine on
    RewriteRule ^/.well-known/carddav http://nextcloud:80/remote.php/dav/ [R=301,L]
    RewriteRule ^/.well-known/caldav http://nextcloud:80/remote.php/dav/ [R=301,L]
    RewriteRule ^/.well-known/webfinger http://nextcloud:80/index.php/.well-known/webfinger [P,L]
    RewriteRule ^/.well-known/nodeinfo http://nextcloud:80/index.php/.well-known/nodeinfo [P,L]
    RewriteRule ^/ocm-provider/(.*)$ http://nextcloud:80/ocm-provider/$1 [P,L]
    # SSL-Zertifikate für die Domain nextcloud.barye.cloudns.asia
    SSLCertificateFile /etc/letsencrypt/live/nextcloud.barye.cloudns.asia/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/nextcloud.barye.cloudns.asia/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf

    # Sicherheitsheader
    Header always set Strict-Transport-Security "max-age=15552000; includeSubDomains"
</VirtualHost>


<VirtualHost *:80>

    ServerName nextcloud.barye.cloudns.asia
    ProxyPreserveHost On 
 # Ausschließen der .well-known-URLs von ProxyPass
    ProxyPass /.well-known !
    ProxyPass /ocm-provider !
# Weiterleitung aller anderen Anfragen
    ProxyPass / http://nextcloud:80/
    ProxyPassReverse / http://nextcloud:80/
 # Spezifische Weiterleitungen für .well-known
    RewriteEngine on
    RewriteCond %{REQUEST_URI} ^/.well-known/.*$
    RewriteRule ^/.well-known/carddav http://nextcloud:80/remote.php/dav/ [P,L]
    RewriteRule ^/.well-known/caldav http://nextcloud:80/remote.php/dav/ [P,L]
    RewriteRule ^/.well-known/webfinger http://nextcloud:80/index.php/.well-known/webfinger [P,L]
    RewriteRule ^/.well-known/nodeinfo http://nextcloud:80/index.php/.well-known/nodeinfo [P,L]

    # Regel für ocm-provider
    RewriteRule ^/ocm-provider/(.*)$ http://nextcloud:80/ocm-provider/$1 [P,L]
   # HTTPS-Redirect
    RewriteCond %{SERVER_NAME} =nextcloud.barye.cloudns.asia
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]

</VirtualHost>

